<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
</head>

<body>
    <header class="container mx-auto">
        <div class="flex justify-between items-center">
            <div>
                <img src="./img/Logo (1).png" alt="rasm">
            </div>

            <div>
                <nav class="flex ml-[600px]">

                    <ul>
                        <p>
                            ВРЕМЯ РАБОТЫ
                            Пн-Вс 9:00-21:00
                        </p>
                        <p>
                            EMAIL
                            info@it-komfort.ru
                        </p>
                        <p>
                            МЕССЕНДЖЕРЫ
                            +79128810296
                        </p>
                        <p>
                            ТЕЛЕФОН
                            +7(342)243-02-96
                        </p>
                    </ul>
                </nav>

            </div>
        </div>
    </header>

    <main>
        <section class="container mx-auto">
            <div class="flex items-center justify-between container ">

                <div>
                    <b class="text-[65px]"> Поможем <br>
                        навести порядок <br>
                        в компании</b>

                    <p class="mt-10 text-[40px]">Внедрение CRM за 2 недели. <br>
                        Работаем по всей России.</p>
                </div>
                <div>
                    <img src="./img/image 15.png" alt="rasm">
                </div>
            </div>

            <div class="mt-15">
                <input type="text" placeholder="Название компании"
                    class="w-65 aria-disabled:cursor-not-allowed outline-none focus:outline-none text-slate-800 dark:text-white placeholder:text-slate-600/60 bg-transparent ring-transparent border border-slate-200 transition-all duration-300 ease-in disabled:opacity-50 disabled:pointer-events-none data-[error=true]:border-red-500 data-[success=true]:border-green-500 text-sm rounded-md py-2 px-2.5 ring shadow-sm data-[icon-placement=start]:ps-9 data-[icon-placement=end]:pe-9 hover:border-slate-800 hover:ring-slate-800/10 focus:border-slate-800 focus:ring-slate-800/10 peer"
                    data-error="false" data-success="false" data-icon-placement="" />

                <input id="contactNumber"
                    class="w-65 bg-transparent placeholder:text-slate-400 text-slate-700 text-sm border border-slate-200 rounded-md px-3 py-2 transition duration-300 ease focus:outline-none focus:border-slate-400 hover:border-slate-300 shadow-sm focus:shadow"
                    placeholder="Телефон*" pattern="^\+\d{1,3}\s\d{1,4}-\d{1,4}-\d{4}$" maxlength="16" />
            </div>

            <div class="bg-blue-300 w-130 mt-5 text-center">
                <button>ЗАКАЗАТЬ БЕСПЛАТНУЮ КОНСУЛЬТАЦИЮ</button>
            </div>

            <div>
                <p>Мы никогда не передаём Ваши данные третьим лицам</p>
            </div>
        </section>
    </main>

</body>

</html>
